<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ご飯大盛りゲーム</title>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    padding-top: 20px;
    background: #222;
    color: #eee;
  }
  h1 {
    margin-bottom: 4px;
  }
  #score {
    font-size: 1.4em;
    margin-bottom: 8px;
  }
  canvas {
    background: #333;
    border: 2px solid #555;
    border-radius: 6px;
    display: block;
    margin: 0 auto;
  }
  #judgement {
    height: 1.6em;
    font-size: 1.4em;
    font-weight: bold;
    color: #f4c542;
    opacity: 0;
    transition: opacity 0.2s;
    margin-top: 6px;
  }
  #judgement.show {
    opacity: 1;
  }
  #hint {
    color: #999;
    margin-top: 6px;
  }
  button {
    font-size: 1.2em;
    padding: 8px 20px;
    margin: 10px 4px 0;
  }
  button:disabled {
    opacity: 0.4;
  }
</style>
</head>
<body>
  <h1>ご飯大盛りゲーム</h1>
  <div id="score">盛った段数: 0</div>
  <canvas id="canvas" width="400" height="600"></canvas>
  <div id="judgement"></div>
  <div>
    <button id="startBtn">スタート</button>
    <button id="dropBtn" disabled>ドロップ</button>
  </div>
  <p id="hint">スペースキーまたはキャンバスのクリックでも操作できます</p>

  <script>
    const CANVAS_W = 400;
    const CANVAS_H = 600;
    const BLOCK_HEIGHT = 30;
    const INITIAL_WIDTH = 160;
    const MOVE_SPEED = 150; // px/秒（一定速度）
    const ACTIVE_SCREEN_Y = 150; // 落とす直前のブロックが表示される画面上のY座標
    const PERFECT_TOLERANCE = 4; // px、これ以内のズレなら「ピッタリ」扱い

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const judgeEl = document.getElementById("judgement");
    const startBtn = document.getElementById("startBtn");
    const dropBtn = document.getElementById("dropBtn");

    let stack = [];
    let movingBlock = null;
    let direction = 1;
    let state = "ready"; // ready | playing | gameover
    let judgeTimeoutId = null;

    function blockColor() {
      return "#fff";
    }

    function drawBlock(x, y, width, height) {
      const curryWidth = width * 0.45;
      const riceWidth = width - curryWidth;

      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(x, y, curryWidth, height);

      ctx.fillStyle = "#f7f2ea";
      ctx.fillRect(x + curryWidth, y, riceWidth, height);

      ctx.strokeStyle = "#d9c7ab";
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, width, height);
    }

    function resetStack() {
      stack = [{ x: (CANVAS_W - INITIAL_WIDTH) / 2, width: INITIAL_WIDTH }];
    }

    function spawnMovingBlock() {
      const top = stack[stack.length - 1];
      movingBlock = { x: 0, width: top.width };
      direction = 1;
    }

    function startGame() {
      resetStack();
      state = "playing";
      spawnMovingBlock();
      updateUI();
    }

    function showJudgement(text) {
      clearTimeout(judgeTimeoutId);
      judgeEl.textContent = text;
      judgeEl.classList.add("show");
      judgeTimeoutId = setTimeout(() => judgeEl.classList.remove("show"), 500);
    }

    function dropBlock() {
      const top = stack[stack.length - 1];
      const left = Math.max(movingBlock.x, top.x);
      const right = Math.min(movingBlock.x + movingBlock.width, top.x + top.width);
      const overlap = right - left;

      if (overlap <= 0) {
        state = "gameover";
        updateUI();
        return;
      }

      const trimmed = movingBlock.width - overlap;
      let newBlock;
      if (trimmed <= PERFECT_TOLERANCE) {
        newBlock = { x: top.x, width: top.width };
        showJudgement("PERFECT!");
      } else {
        newBlock = { x: left, width: overlap };
      }

      stack.push(newBlock);
      spawnMovingBlock();
      updateUI();
    }

    function handleStart() {
      startGame();
    }

    function handleDrop() {
      if (state === "playing") dropBlock();
    }

    // スペースキー/キャンバスクリックは状態に応じてスタートかドロップを兼ねる
    function handleAction() {
      if (state === "playing") {
        dropBlock();
      } else {
        startGame();
      }
    }

    function updateUI() {
      scoreEl.textContent = "盛った段数: " + (stack.length - 1);
      startBtn.textContent = state === "gameover" ? "リスタート" : "スタート";
      dropBtn.disabled = state !== "playing";
    }

    // 茶碗を描く（localY はお椀の縁のローカルY座標）
    function drawBowl(localY) {
      const rimWidth = 260;
      const bottomWidth = 140;
      const height = 70;

      ctx.beginPath();
      ctx.moveTo(-rimWidth / 2, localY);
      ctx.lineTo(rimWidth / 2, localY);
      ctx.quadraticCurveTo(rimWidth / 2 - 10, localY + height * 0.7, bottomWidth / 2, localY + height);
      ctx.lineTo(-bottomWidth / 2, localY + height);
      ctx.quadraticCurveTo(-(rimWidth / 2 - 10), localY + height * 0.7, -rimWidth / 2, localY);
      ctx.closePath();
      ctx.fillStyle = "#e8d9c3";
      ctx.fill();
      ctx.strokeStyle = "#a98f65";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, localY, rimWidth / 2, 8, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "#a98f65";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // GameOver後、全段＋茶碗が収まるようにズームアウトして描画
    function drawZoomedOutResult() {
      const BOWL_HEIGHT = 70;
      const PADDING_TOP = 50;
      const PADDING_BOTTOM = 20;

      const top = -(stack.length - 1) * BLOCK_HEIGHT; // 一番高いブロックの上端
      const bowlRimLocalY = BLOCK_HEIGHT - top; // 土台の底＝お椀の縁
      const totalHeight = bowlRimLocalY + BOWL_HEIGHT;
      const availableHeight = CANVAS_H - PADDING_TOP - PADDING_BOTTOM;
      const scale = availableHeight / totalHeight;

      ctx.save();
      ctx.translate(CANVAS_W / 2, PADDING_TOP);
      ctx.scale(scale, scale);

      drawBowl(bowlRimLocalY);

      for (let i = 0; i < stack.length; i++) {
        const block = stack[i];
        const worldY = -i * BLOCK_HEIGHT;
        const localY = worldY - top;
        drawBlock(block.x - CANVAS_W / 2, localY, block.width, BLOCK_HEIGHT);
      }

      ctx.restore();
    }

    function worldYToScreenY(worldY, topWorldY) {
      return ACTIVE_SCREEN_Y + BLOCK_HEIGHT + (worldY - topWorldY);
    }

    function draw() {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

      if (state === "gameover") {
        drawZoomedOutResult();

        ctx.fillStyle = "#f55";
        ctx.font = "28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", CANVAS_W / 2, 30);
        ctx.fillStyle = "#ccc";
        ctx.font = "16px sans-serif";
        ctx.fillText("盛った段数: " + (stack.length - 1), CANVAS_W / 2, 52);
        return;
      }

      const topWorldY = -(stack.length - 1) * BLOCK_HEIGHT;
      const visibleCount = 20;
      const startIndex = Math.max(0, stack.length - visibleCount);

      for (let i = startIndex; i < stack.length; i++) {
        const block = stack[i];
        const worldY = -i * BLOCK_HEIGHT;
        const screenY = worldYToScreenY(worldY, topWorldY);
        if (screenY > CANVAS_H) continue;
        drawBlock(block.x, screenY, block.width, BLOCK_HEIGHT);
      }

      if (state === "playing" && movingBlock) {
        drawBlock(movingBlock.x, ACTIVE_SCREEN_Y, movingBlock.width, BLOCK_HEIGHT);
      }

      if (state === "ready") {
        ctx.fillStyle = "#ccc";
        ctx.font = "20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("スペース / クリックでスタート", CANVAS_W / 2, CANVAS_H / 2);
      }
    }

    let lastFrameTime = performance.now();
    function frame(now) {
      const dt = (now - lastFrameTime) / 1000;
      lastFrameTime = now;

      if (state === "playing" && movingBlock) {
        movingBlock.x += direction * MOVE_SPEED * dt;
        if (movingBlock.x <= 0) {
          movingBlock.x = 0;
          direction = 1;
        } else if (movingBlock.x + movingBlock.width >= CANVAS_W) {
          movingBlock.x = CANVAS_W - movingBlock.width;
          direction = -1;
        }
      }

      draw();
      requestAnimationFrame(frame);
    }

    resetStack();
    updateUI();
    requestAnimationFrame(frame);

    startBtn.addEventListener("click", handleStart);
    dropBtn.addEventListener("click", handleDrop);
    canvas.addEventListener("click", handleAction);
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        handleAction();
      }
    });
  </script>
</body>
</html>
