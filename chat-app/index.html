<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>簡易Webチャット</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
  }
  #status {
    color: #666;
    margin-bottom: 10px;
  }
  #inputRow {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  #msgInput {
    flex: 1;
    font-size: 1em;
    padding: 6px;
  }
  #sendBtn {
    font-size: 1em;
    padding: 6px 16px;
  }
  #log {
    border: 1px solid #ccc;
    height: 300px;
    overflow-y: auto;
    padding: 8px;
    background: #fafafa;
  }
  .log-entry {
    margin-bottom: 4px;
  }
  .self {
    color: #1a5fb4;
  }
  .other {
    color: #333;
  }
</style>
</head>
<body>
  <h1>簡易Webチャット</h1>
  <div id="status">接続中...</div>

  <div id="inputRow">
    <input type="text" id="msgInput" placeholder="メッセージを入力">
    <button id="sendBtn">表示</button>
  </div>

  <div id="log"></div>

  <script>
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const inputEl = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    const host = location.hostname || "localhost";
    const ws = new WebSocket("ws://" + host + ":8080");

    function appendLog(text, className) {
      const div = document.createElement("div");
      div.className = "log-entry " + className;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    ws.addEventListener("open", () => {
      statusEl.textContent = "接続済み";
    });

    ws.addEventListener("close", () => {
      statusEl.textContent = "切断されました";
    });

    ws.addEventListener("message", (event) => {
      const { from, text } = JSON.parse(event.data);
      appendLog(from + ": " + text, "other");
    });

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      appendLog("自分: " + text, "self");
      ws.send(text);
      inputEl.value = "";
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
